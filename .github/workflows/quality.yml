name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements/runtime.lock
            backend/requirements/test.txt
      - name: Install Python Dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements/runtime.lock
          python -m pip install -r backend/requirements/test.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts
      - name: Verify Backend Core
        env:
          IMBA_VERIFY_REPORT_DIR: data/checks/ci/backend
        run: bash tools/quality/verify.sh backend-core

      - name: Verify Complete Backend Suite
        env:
          IMBA_VERIFY_REPORT_DIR: data/checks/ci/backend-all
        run: bash tools/quality/verify.sh backend-all

      - name: Verify Offline Packaging Contracts
        run: python -m unittest discover -s docker/offline/tests -p 'test_offline_*.py' -v

      - name: Verify Repository Utilities
        run: python -m unittest discover -s tools/tests/utilities -v

      - name: Verify Frontend
        env:
          IMBA_VERIFY_REPORT_DIR: data/checks/ci/frontend
        run: bash tools/quality/verify.sh frontend
      - name: Run Independent Acceptance Tests
        run: python -m pytest -c tools/tests/acceptance/pytest.ini tools/tests/acceptance -q
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: data/checks/ci
          if-no-files-found: warn
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --require-hashes -r backend/requirements/runtime.lock
          python -m pip install -r backend/requirements/test.txt
      - name: DDS concurrency and schema acceptance on owned PostgreSQL
        run: |
          python backend/tests/postgres/check_queue.py
          python backend/tests/postgres/check_phone.py
          python backend/tests/postgres/check_audit.py
      - name: Build backend and verify actual backup restore
        run: |
          docker build -f docker/images/backend.Dockerfile -t simulator_backend:ci .
          BACKEND_IMAGE=simulator_backend:ci bash backend/tests/postgres/check_backup_restore.sh
