name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock
            tools_tests/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.lock
          pip install -r tools_tests/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_react/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend_react
          npm ci

      - name: Verify Backend Core
        run: bash scripts/verify_build.sh backend-core

      - name: Verify Offline Packaging Contracts
        run: python -m unittest discover -s scripts/tests -p 'test_offline_*.py' -v

      - name: Verify Frontend
        run: bash scripts/verify_build.sh frontend

      - name: Run Independent Acceptance Tests
        run: python -m pytest -c tools_tests/pytest.ini tools_tests -q
