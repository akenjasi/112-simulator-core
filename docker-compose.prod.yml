# ─────────────────────────────────────────────────────────────────────────────
# 112 Simulator V2 — Docker Compose (Production Release)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: simulator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepass
      POSTGRES_DB: simulator112
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d simulator112"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simulator_net

  # ─── Backend: FastAPI + Qwen TTS ───────────────────────────────────────────
  backend:
    image: simulator_backend:latest
    container_name: simulator_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://admin:securepass@postgres:5432/simulator112"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      - simulator_data:/app/data
      - ./data/models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simulator_net

  # ─── Frontend: Next.js static export → Nginx ───────────────────────────────
  frontend:
    image: simulator_frontend:latest
    container_name: simulator_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - simulator_net

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  simulator_data:
    driver: local
  postgres_data:
    driver: local

# ─── Internal network ─────────────────────────────────────────────────────────
networks:
  simulator_net:
    driver: bridge
