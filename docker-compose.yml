# ─────────────────────────────────────────────────────────────────────────────
# 112 Simulator V2 — Docker Compose
# Services: backend (FastAPI + Qwen TTS) + frontend (Next.js → Nginx)
#
# Запуск:  docker compose up --build
# Первый запуск: backend автоматически скачает GGUF-модели (~880 MB).
# Последующие запуски: модели берутся из named volume (не скачиваются снова).
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Backend: FastAPI + Qwen TTS ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: simulator_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Абсолютный путь внутри контейнера (volume монтируется на /app/data)
      DATABASE_URL: "sqlite+aiosqlite:////app/data/112_simulator.db"
      # CORS: добавь свой домен при необходимости
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      # ── Persistent: SQLite DB, TTS cache, uploads ──────────────────────────
      - simulator_data:/app/data
      # ── Persistent: GGUF model weights (~880 MB) ───────────────────────────
      # Первый запуск: скачиваются. Повторные: берутся из volume.
      - simulator_models:/app/backend/core/qwen_tts/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      # start_period: время до первого healthcheck.
      # При первом запуске скачивается ~880 MB → нужен запас.
      # На быстром интернете ~3-5 мин, на медленном до 30 мин.
      start_period: 600s
    networks:
      - simulator_net

  # ─── Frontend: Next.js static export → Nginx ───────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: simulator_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Frontend стартует сразу; Nginx proxies /api/* → backend.
    # При недоступном backend Nginx вернёт 502 на API запросы.
    depends_on:
      - backend
    networks:
      - simulator_net

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  # SQLite база + TTS аудио-кэш + загружаемые файлы
  simulator_data:
    driver: local
  # Qwen TTS GGUF-модели (~880 MB, скачиваются один раз)
  simulator_models:
    driver: local

# ─── Internal network ─────────────────────────────────────────────────────────
networks:
  simulator_net:
    driver: bridge
