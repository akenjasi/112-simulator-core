services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp@sha256:951661b272f3ff206c499719d69864b9f53621786ff8e55ce1bb8996b4bf48a1
    restart: unless-stopped
    ports:
    - 127.0.0.1:8081:8080
    volumes:
    - llm_prompt_cache:/cache
    - type: bind
      source: ${DDS_LLM_MODEL_PATH:-./models/llm/Qwen3.5-4B-Q4_K_M.gguf}
      target: /models/report.gguf
      read_only: true
      bind:
        create_host_path: false
        selinux: z
    command:
    - --model
    - /models/report.gguf
    - --alias
    - '${DDS_LLM_MODEL:-dds-qwen}'
    - --offline
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --n-gpu-layers
    - '0'
    - --threads
    - '${DDS_LLM_THREADS:-4}'
    - --sleep-idle-seconds
    - '${DDS_LLM_SLEEP_IDLE_SECONDS:--1}'
    - --cache-prompt
    - --slot-save-path
    - /cache/
    - --cache-ram
    - '${DDS_LLM_CACHE_RAM_MB:-512}'
    - --ctx-checkpoints
    - '16'
    - --checkpoint-min-step
    - '256'
    - --no-context-shift
    - --jinja
    - --batch-size
    - '256'
    - --ubatch-size
    - '128'
    - --slots
    - --ctx-size
    - '${DDS_LLM_CONTEXT_SIZE:-8192}'
    - --parallel
    - '1'
    - --n-predict
    - '1200'
    profiles:
    - llm
    networks:
    - simulator_net
networks:
  simulator_net:
    driver: bridge
volumes:
  llm_prompt_cache:
