services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp@sha256:951661b272f3ff206c499719d69864b9f53621786ff8e55ce1bb8996b4bf48a1
    restart: unless-stopped
    ports:
    - 127.0.0.1:8081:8080
    volumes:
    - type: bind
      source: ${DDS_LLM_MODEL_PATH}
      target: /models/report.gguf
      read_only: true
      bind:
        create_host_path: false
        selinux: z
    command:
    - --model
    - /models/report.gguf
    - --alias
    - dds-qwen
    - --offline
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --n-gpu-layers
    - '0'
    - --threads
    - '${DDS_LLM_THREADS:-4}'
    - --sleep-idle-seconds
    - '10'
    - --batch-size
    - '32'
    - --ubatch-size
    - '32'
    - --slots
    - --ctx-size
    - '8192'
    - --parallel
    - '1'
    - --n-predict
    - '1200'
    profiles:
    - llm
    networks:
    - simulator_net
networks:
  simulator_net:
    driver: bridge
