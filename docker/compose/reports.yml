# Optional bridge between the main stack and docker/compose/llm.yml.
# Supply DDS_LLM_MODEL_PATH for an existing local GGUF; no model is downloaded.
services:
  backend:
    depends_on:
      llm:
        condition: service_healthy
    environment:
      DDS_LLM_BASE_URL: ${DDS_LLM_CONTAINER_BASE_URL:-http://llm:8080/v1}
      DDS_LLM_MODEL: ${DDS_LLM_MODEL:-dds-qwen}
  llm:
    networks:
      - simulator_net
