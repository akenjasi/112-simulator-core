# Optional bridge between the main stack and the CPU-only report runtime.
# make up prepares default weights before launch; custom GGUF paths must exist.
services:
  backend:
    depends_on:
      llm:
        condition: service_healthy
    environment:
      DDS_LLM_BASE_URL: ${DDS_LLM_CONTAINER_BASE_URL:-http://llm:8080/v1}
      DDS_LLM_MODEL: ${DDS_LLM_MODEL:-dds-qwen}
  llm:
    networks:
      - simulator_net
