# ─────────────────────────────────────────────────────────────────────────────
# 112 Simulator V2 — Nginx config for Frontend container
# Serves Next.js static export on port 3000 (HTTP) and port 443 (HTTPS).
# Proxies /api/* requests & WebSockets to the backend service.
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ─── HTTP Server (Port 3000) ──────────────────────────────────────────────────
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Strip trailing slashes so /teacher/sessions/ → /teacher/sessions ────
    # This prevents Nginx from serving the directory (which gives 403)
    rewrite ^(.+)/$ $1 permanent;

    # ─── API proxy & WebSockets → backend container ───────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Allow large audio/file uploads
        client_max_body_size 64m;
    }



    # ─── WebSocket proxy (SIP.js / telephony) ────────────────────────────────
    location /ws {
        proxy_pass         http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    # ─── Next.js static export — SPA fallback ─────────────────────────────────
    location / {
        try_files $uri.html $uri /index.html;
    }

    # ─── Static assets cache ─────────────────────────────────────────────────
    location ~* \.(js|css|woff2?|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
}

# ─── HTTPS / TLS Server (Port 443) ───────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # ─── API proxy & WebSockets → backend container ───────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Allow large audio/file uploads
        client_max_body_size 64m;
    }



    # ─── WebSocket proxy (SIP.js / telephony) ────────────────────────────────
    location /ws {
        proxy_pass         http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    # ─── Next.js static export ─────────────────────────────────────────────────
    # Try exact .html file first, then fallback to index.html (no directory lookup)
    location / {
        try_files $uri.html $uri /index.html;
    }

    # ─── Static assets cache ─────────────────────────────────────────────────
    location ~* \.(js|css|woff2?|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
}
